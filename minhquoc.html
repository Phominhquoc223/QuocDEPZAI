<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ | Tên Website Của Bạn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        /* Thanh điều hướng (Navbar) */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            z-index: 100;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            text-decoration: none;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Khu vực Hero (Giới thiệu chính) */
        .hero {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 20px 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #f8fafc;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            max-width: 600px;
            margin: 0 auto 36px;
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background-color: #1e293b;
            border-color: #475569;
        }

        /* Khu vực Tính năng / Dịch vụ */
        .features {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 48px;
            color: #e2e8f0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Khu vực Liên hệ */
        .contact {
            max-width: 700px;
            margin: 40px auto 80px;
            padding: 48px 24px;
            background-color: #1e293b;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
        }

        .contact h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
        }

        .contact p {
            color: #94a3b8;
            margin-bottom: 24px;
        }

        /* Chân trang (Footer) */
        footer {
            border-top: 1px solid #1e293b;
            padding: 24px 20px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
